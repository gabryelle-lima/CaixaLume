name: Preparar versão privada

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão no formato 0.1.1'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publicar pacote
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Versão inválida.' }
          $destination = Join-Path $PWD ('artifacts\publicacao\CaixaLume-' + $env:RELEASE_VERSION)
          & .\scripts\Publicar.ps1 -Destino $destination -Versao $env:RELEASE_VERSION
      - name: Criar versão para revisão
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $archive = Join-Path $PWD ('artifacts\publicacao\CaixaLume-' + $env:RELEASE_VERSION + '-win-x64.zip')
          $checksum = $archive + '.sha256'
          $notesFile = Join-Path $env:RUNNER_TEMP 'notas-caixalume.md'
          $notes = @'
          Piloto controlado. A aceitação na máquina de teste ainda está pendente; este pacote não foi liberado para uso comercial.

          Instalação manual: baixe o ZIP privado, extraia todos os arquivos e execute Instalar-CaixaLume.cmd com o aplicativo fechado. Leia COMO_EXECUTAR.md antes de atualizar. O banco de dados não está no ZIP.

          Para testar sem tocar no banco real, execute Iniciar-Piloto.cmd na pasta da versão instalada. Ele usa uma base de teste separada. O atalho CaixaLume abre a operação normal.
          '@
          Set-Content -LiteralPath $notesFile -Value $notes -Encoding utf8
          & gh release create ('v' + $env:RELEASE_VERSION) $archive $checksum --draft --prerelease --title ('CaixaLume ' + $env:RELEASE_VERSION) --notes-file $notesFile
          if ($LASTEXITCODE -ne 0) { throw 'Não foi possível criar a versão privada.' }
